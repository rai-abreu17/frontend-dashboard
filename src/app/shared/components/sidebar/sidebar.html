<div class="sidebar-logo">
  <div class="logo-icon">B</div>
  <span class="logo-text" *ngIf="expanded()">BoxFlow</span>
</div>

<button class="toggle-btn" type="button" (click)="toggle()" [title]="expanded() ? 'Recolher menu' : 'Expandir menu'">
  <lucide-angular [name]="expanded() ? 'chevron-left' : 'chevron-right'" size="22"></lucide-angular>
</button>

<nav class="sidebar-nav">
  <ul>
    <li><a routerLink="/dashboard" routerLinkActive="active" title="Dashboard"><lucide-angular name="layout-dashboard" size="24"></lucide-angular><span class="nav-label" *ngIf="expanded()">Dashboard</span></a></li>
    <li><a routerLink="/boxes" routerLinkActive="active" title="Boxes"><lucide-angular name="box" size="24"></lucide-angular><span class="nav-label" *ngIf="expanded()">Boxes</span></a></li>
    <li><a routerLink="/materiais" routerLinkActive="active" title="Materiais"><lucide-angular name="package" size="24"></lucide-angular><span class="nav-label" *ngIf="expanded()">Materiais</span></a></li>
    <li><a routerLink="/historico" routerLinkActive="active" title="Histórico"><lucide-angular name="history" size="24"></lucide-angular><span class="nav-label" *ngIf="expanded()">Histórico</span></a></li>
    <li><a routerLink="/relatorios" routerLinkActive="active" title="Relatórios"><lucide-angular name="file-text" size="24"></lucide-angular><span class="nav-label" *ngIf="expanded()">Relatórios</span></a></li>
    <li><a routerLink="/validacao" routerLinkActive="active" title="Validação"><lucide-angular name="check-square" size="24"></lucide-angular><span class="nav-label" *ngIf="expanded()">Validação</span></a></li>
    <li><a routerLink="/copiloto" routerLinkActive="active" title="Copiloto de IA"><lucide-angular name="bot" size="24"></lucide-angular><span class="nav-label" *ngIf="expanded()">Copiloto de IA</span></a></li>
  </ul>
</nav>
<div class="sidebar-footer">
  <a routerLink="/demo" routerLinkActive="active" title="Demo Settings" class="settings-btn"><lucide-angular name="settings" size="24"></lucide-angular><span class="nav-label" *ngIf="expanded()">Configurações</span></a>
</div>
