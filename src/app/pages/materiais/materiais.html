<div class="materiais-page">
  <div class="page-header mb-6 d-flex justify-between align-center">
    <div>
      <h1 class="text-2xl font-bold">Materiais</h1>
      <p class="text-muted">Gestão de materiais e produtos cadastrados</p>
    </div>
    <div class="actions d-flex gap-4">
      <button class="btn btn-primary d-flex align-center gap-2">
        <lucide-angular name="package" size="16"></lucide-angular>
        Adicionar Material
      </button>
    </div>
  </div>

  <div class="card table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>Identificação</th>
          <th>Nome</th>
          <th>Situação</th>
          <th>Cor no Sistema</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        @for (material of materials$ | async; track material.id) {
          <tr>
            <td class="font-medium">{{ material.id }}</td>
            <td>{{ material.name }}</td>
            <td>
              <span class="badge text-xs font-semibold" [ngClass]="material.active ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'">
                {{ material.active ? 'Ativo' : 'Inativo' }}
              </span>
            </td>
            <td>
              <div class="color-preview d-flex align-center gap-2">
                <span class="color-dot" [style.background-color]="material.displayColor"></span>
                <span class="text-sm text-muted">{{ material.displayColor }}</span>
              </div>
            </td>
            <td>
              <button class="btn-icon">
                <lucide-angular name="settings" size="16"></lucide-angular>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
